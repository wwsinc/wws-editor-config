# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  CI_BUILD: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Full history and tags, so MinVer can compute the version from the latest tag

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Pack
      run: dotnet pack Wws.EditorConfig/Wws.EditorConfig.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v7
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
      - name: Validate package
        run: |
          $packages = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Filter *.nupkg)
          if ($packages.Count -eq 0) { throw "No .nupkg found in ${{ env.NuGetDirectory }}" }
          foreach ($package in $packages) {
            Write-Host "Validating package: $($package.FullName)"
            meziantou.validate-nuget-package $package.FullName --excluded-rules Symbols
          }

  smoke_test:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Consumes the package from a throwaway solution and checks the rules are enforced
      - name: Smoke test
        run: ./tests/smoke/run.ps1 -PackageDirectory "${{ env.NuGetDirectory }}"

  deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # The release tag (e.g. 1.3.3) is the package version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ validate_nuget, smoke_test ]
    permissions:
      id-token: write # Lets the job request the GitHub OIDC token that Trusted Publishing exchanges for a NuGet key
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      # Trusted Publishing: swap the GitHub OIDC token for a NuGet API key that is valid for one hour
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      # user is the nuget.org profile name that owns the package and the Trusted Publishing policy (not an email address)
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0, pinned: third-party action that receives the publish token
        id: login
        with:
          user: vadimKh

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          $packages = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Filter *.nupkg)
          if ($packages.Count -eq 0) { throw "No .nupkg found in ${{ env.NuGetDirectory }}" }
          foreach ($file in $packages) {
            dotnet nuget push $file --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
